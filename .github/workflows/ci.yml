name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: openkg, POSTGRES_PASSWORD: openkg, POSTGRES_DB: openkg_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openkg" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check openkg tests
      - name: Tests (SQLite)
        run: uv run pytest
      - name: Migrations apply cleanly and match the models
        env: { DATABASE_URL: "postgresql://openkg:openkg@localhost:5432/openkg_test" }
        run: uv run alembic upgrade head && uv run alembic check
      - name: Tests (PostgreSQL)
        env: { TEST_DATABASE_URL: "postgresql://openkg:openkg@localhost:5432/openkg_test" }
        run: uv run pytest
      - name: Dependency audit
        run: uvx pip-audit --disable-pip -r <(uv export --frozen --no-dev --no-hashes) || true

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high || true

  e2e:
    # Manual trigger only until this job has been observed passing in CI.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Start API (SQLite, embedded worker, fast simulation)
        working-directory: apps/api
        env: { DATABASE_URL: "sqlite:///./ci.db", EXECUTION_MODE: embedded, FIXTURE_STEP_DELAY: "0.4" }
        run: uv sync --frozen && (uv run openkg serve --port 8100 &) && sleep 8
      - name: Build and start web
        working-directory: apps/web
        run: npm ci && npm run build && cp -r .next/static .next/standalone/.next/static && (PORT=3100 node .next/standalone/server.js &) && sleep 4
      - name: Browser tests
        working-directory: apps/web
        run: npx playwright install --with-deps chromium && npx playwright test
