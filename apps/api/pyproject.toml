[project]
name = "openkg"
version = "0.1.0"
description = "OpenKG API, domain services, research agents and workers"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary,pool]>=3.2",
  "celery[redis]>=5.4",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "deepagents>=0.2",
  "langgraph>=0.6",
  "langgraph-checkpoint-postgres>=2.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-openai>=0.3",
  "langchain-anthropic>=0.3",
]

[project.scripts]
openkg = "openkg.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openkg"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
